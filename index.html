<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AlphaTonices AP</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --border: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --primary: #fafafa;
            --primary-invert: #18181b;
            --error-bg: #450a0a;
            --error-text: #fca5a5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.35rem; }
        .header p { color: var(--text-muted); font-size: 0.85rem; }

        /* Error alert banner */
        .alert {
            display: none;
            background: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            line-height: 1.3;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(252, 165, 165, 0.2);
            word-break: break-word;
        }

        /* Tabs */
        .tabs { display: flex; margin-bottom: 1.5rem; background: #000; border-radius: 8px; padding: 0.25rem; border: 1px solid var(--border); }
        .tab-btn {
            flex: 1; padding: 0.5rem; background: transparent; border: none; color: var(--text-muted);
            border-radius: 6px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--surface); color: var(--text-main); font-weight: 500; }

        .form-view { display: none; }
        .form-view.active { display: block; }

        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-size: 0.8rem; margin-bottom: 0.4rem; color: var(--text-muted); }
        input {
            width: 100%; padding: 0.75rem; background: #000; border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-main); font-size: 0.9rem; outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #52525b; }

        .btn {
            width: 100%; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; font-weight: 500;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 0.6rem;
            border: none; transition: all 0.2s; margin-bottom: 0.75rem;
        }
        .btn-primary { background: var(--primary); color: var(--primary-invert); }
        .btn-primary:hover { background: #e4e4e7; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #27272a; }

        .divider {
            display: flex; align-items: center; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.75rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
        .divider:not(:empty)::before { margin-right: 1rem; }
        .divider:not(:empty)::after { margin-left: 1rem; }
    #verifying-screen{display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);justify-content:center;align-items:center;padding:1rem}#verifying-screen.show{display:flex}.verifying-card{width:100%;max-width:420px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2rem;box-shadow:0 10px 40px rgba(0,0,0,.45)}.verifying-card h2{font-size:1.05rem;margin:1rem 0 .5rem}.verifying-card p{color:var(--text-muted);font-size:.85rem;line-height:1.5}.spinner{width:34px;height:34px;margin:auto;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.password-rule,.code-notice{display:block;margin-top:.35rem;color:var(--text-muted);font-size:.72rem;line-height:1.4}.code-notice{text-align:center}</style>
</head>
<body>
<div id="verifying-screen"><div class="verifying-card"><div class="spinner"></div><h2>Wait, we are verifying your connection.</h2><p>Please wait while we securely verify your connection.</p></div></div>

    <div class="auth-card">
        <div class="header">
            <h1>AlphaTonices AP</h1>
            <p>Access Gateway</p>
        </div>

        <div class="alert" id="error-alert"></div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-btn-account">Account</button>
            <button class="tab-btn" id="tab-btn-code">Access Code</button>
        </div>

        <!-- Account Tab -->
        <div id="view-account" class="form-view active">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" minlength="8" autocomplete="current-password">
            </div>
            <small class="password-rule">Password must be at least 8 characters and contain at least one uppercase letter.</small>
            <button class="btn btn-primary" id="btn-email-login">Continue with Email</button>

            <div class="divider">OR</div>

            <button class="btn btn-outline" id="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google
            </button>
            <button class="btn btn-outline" id="btn-github">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                GitHub
            </button>
        </div>

        <!-- Code Tab -->
        <div id="view-code" class="form-view">
            <div class="input-group">
                <label>Clearance Code</label>
                <input type="password" id="access-code" placeholder="Enter access code">
            </div>
            <button class="btn btn-primary" id="btn-code-login">Validate & Enter</button><p class="code-notice">Access-code accounts are temporary and are automatically deleted after 30 days.</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, GithubAuthProvider, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2kQNio81sFpQbVo-6rg6vghjIGWCIfgI",
            authDomain: "access-portal-alpha-tonics7.firebaseapp.com",
            projectId: "access-portal-alpha-tonics7",
            storageBucket: "access-portal-alpha-tonics7.firebasestorage.app",
            messagingSenderId: "18965936184",
            appId: "1:18965936184:web:257f08ecc6e31f08cccecd",
            measurementId: "G-DPY7Q6B7MN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const errorAlert = document.getElementById('error-alert');

        function showError(msg) {
            errorAlert.textContent = msg;
            errorAlert.style.display = 'block';
            console.error("[Auth Error]", msg);
        }

        function clearError() {
            errorAlert.textContent = '';
            errorAlert.style.display = 'none';
        }

        function formatAuthError(err) {
            const messages = {
                'auth/invalid-credential': 'Incorrect email or password.',
                'auth/wrong-password': 'Incorrect email or password.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/email-already-in-use': 'An account with this email already exists. Please sign in.',
                'auth/weak-password': 'Password must be at least 6 characters.',
                'auth/popup-blocked': 'The browser blocked the sign-in popup. Please allow popups for this page.',
                'auth/popup-closed-by-user': 'The sign-in popup was closed.',
                'auth/operation-not-allowed': 'This sign-in method is not enabled in Firebase Authentication.',
                'auth/unauthorized-domain': 'This website domain is not authorized in Firebase Authentication.',
                'auth/network-request-failed': 'Network error. Check your internet connection and try again.'
            };
            return messages[err.code] || (err.code ? err.code + ': ' + err.message : 'Authentication failed.');
        }

        async function logSessionAndRedirect(user, method) {
            try {
                await setDoc(doc(db, "users", user.uid), {
                    email: user.email || "Anonymous",
                    uid: user.uid,
                    authMethod: method,
                    lastLogin: serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.warn("Firestore write skipped:", e.message);
            }
            document.getElementById("verifying-screen").classList.add("show");
            window.location.href = "https://mymap.icu/verify.php?verify=YYE9JC";
        }

        // SHA-256 for code validation
        async function hashString(str) {
            const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        // SHA-256 digest of "AlphaTonicesProject"
        const TARGET_HASH = "a9c682f763d1fd68971e80a1ff40c41e8bf71c8823b873a4e6ca9c3409e11562";

        // Tab Navigation
        const tabAccount = document.getElementById('tab-btn-account');
        const tabCode = document.getElementById('tab-btn-code');
        const viewAccount = document.getElementById('view-account');
        const viewCode = document.getElementById('view-code');

        tabAccount.addEventListener('click', () => {
            clearError();
            tabAccount.classList.add('active');
            tabCode.classList.remove('active');
            viewAccount.classList.add('active');
            viewCode.classList.remove('active');
        });

        tabCode.addEventListener('click', () => {
            clearError();
            tabCode.classList.add('active');
            tabAccount.classList.remove('active');
            viewCode.classList.add('active');
            viewAccount.classList.remove('active');
        });

        // Email / Password
        document.getElementById('btn-email-login').addEventListener('click', async () => {
            clearError();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            if (!email || !password) return showError("Email and password are required.");
            if (password.length < 8) return showError("Password must be at least 8 characters long.");
            if (!/[A-Z]/.test(password)) return showError("Password must contain at least one uppercase letter.");

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                await logSessionAndRedirect(cred.user, "email");
            } catch (err) {
                if (err.code === 'auth/user-not-found') {
                    try {
                        const cred = await createUserWithEmailAndPassword(auth, email, password);
                        await logSessionAndRedirect(cred.user, "email_registration");
                    } catch (regErr) {
                        showError(formatAuthError(regErr));
                    }
                } else {
                    showError(formatAuthError(err));
                }
            }
        });

        // Google Login
        document.getElementById('btn-google').addEventListener('click', async () => {
            clearError();
            const provider = new GoogleAuthProvider();
            try { 
                const cred = await signInWithPopup(auth, provider); 
                await logSessionAndRedirect(cred.user, "google");
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(formatAuthError(err));
                }
            }
        });

        // GitHub Login
        document.getElementById('btn-github').addEventListener('click', async () => {
            clearError();
            const provider = new GithubAuthProvider();
            try { 
                const cred = await signInWithPopup(auth, provider); 
                await logSessionAndRedirect(cred.user, "github");
            } catch (err) {
                if (err.code !== 'auth/popup-closed-by-user') {
                    showError(formatAuthError(err));
                }
            }
        });

        // Access Code (Anonymous Auth)
        document.getElementById('btn-code-login').addEventListener('click', async () => {
            clearError();
            const code = document.getElementById('access-code').value.trim();
            if (!code) return showError("Please enter the clearance access code.");
            
            try {
                const hashedInput = await hashString(code);
                if (hashedInput !== TARGET_HASH) {
                    showError("Invalid access code.");
                    return;
                }

                const cred = await signInAnonymously(auth);
                await logSessionAndRedirect(cred.user, "anonymous_code");
            } catch (err) {
                showError(formatAuthError(err));
            }
        });
    </script>
</body>
</html>
